name: Publish mobile app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only the OCR packages are needed; skip Electron and native builds.
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: node mobile/scripts/vendor.js
      - name: Assemble site
        run: |
          mkdir _site
          cp -r mobile/index.html mobile/app.css mobile/sw.js mobile/manifest.webmanifest \
                mobile/js mobile/icons mobile/vendor _site/
          # New cache name per deploy, so installed apps pick up the update.
          sed -i "s/const VERSION = '[^']*'/const VERSION = '${GITHUB_SHA::7}'/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
